# Сеть ИИ-инфраструктуры v3 — реестр ПИВОТОВ.
#
# Что изменилось относительно v2. Там у карты был один центр (`anchor: nvidia`) и
# правило «сущность дальше двух шагов от него в карту не входит». Здесь центров 26, и
# правило становится КОЛЛЕКТИВНЫМ: сущность входит, если она в двух шагах хотя бы от
# одного пивота. Мера та же, точек отсчёта больше.
#
# Пивоты НЕ исследуются заново. Все 26 уже имеют полные профили в
# handoff/nvidia_ecosystem.json: двухшаговый радиус вокруг NVIDIA и список слежения v2
# вобрали в себя весь ландшафт, который называет блюпринт v3. Этот файл только помечает,
# кто из уже собранных сущностей — пивот (`pivotal: true` в файле передачи).
#
# ЕДИНСТВЕННОЕ фактическое расхождение с таблицей блюпринта — Google Cloud: в данных v2
# его не было отдельно от `google`, и он заводится новым профилем.

# ЧИСЛО ПИВОТОВ — 27, а не 26, и это осознанно. Блюпринт под номером 23 держит
# «Synopsys/Cadence» ОДНОЙ записью, из-за чего его список короче на единицу. Таблица
# соответствия в промпте — источник обязательств — разводит их на две строки с разными
# id, и в данных v2 это две отдельные компании с разными профилями и разной критичностью.
# Слить две настоящие компании в один узел ради круглого числа было бы хуже, чем
# разойтись с текстом на единицу. Расхождение вынесено в журнал сборки.
network_id: ai-infrastructure-complete
seed: handoff/nvidia_ecosystem.json     # откуда берутся 106 сущностей и 243 связи
hops: 2                                  # то же правило, но от ЛЮБОГО пивота

pivots:
  # ── Железо (блюпринт: Hardware Layer) ──────────────────────────────────────
  - { id: nvidia,   group: hardware, note: "Ускорители и платформа; якорь пилота v2" }
  - { id: google,   group: hardware, note: "Собственный ускоритель TPU внутри облака" }
  - { id: tsmc,     group: hardware, note: "Фабрика, делающая передовой кремний обеим сторонам" }
  - { id: intel,    group: hardware, note: "Фабрика и разработчик процессоров" }
  - { id: amd,      group: hardware, note: "Второй разработчик ускорителей" }
  - { id: asml,     group: hardware, note: "Единственный производитель станков EUV" }
  - { id: arm,      group: hardware, note: "26-й, названный блюпринтом опциональным; в данных есть" }

  # ── Софт и фреймворки ─────────────────────────────────────────────────────
  - { id: pytorch,     group: software, note: "Библиотека обучения, в которой написано большинство исследований" }
  - { id: jax,         group: software, note: "Вторая библиотека обучения, вокруг чужого ускорителя" }
  - { id: cuda,        group: software, note: "Среда программирования — главный ров" }
  - { id: huggingface, group: software, note: "Хаб моделей и общая библиотека" }
  - { id: vllm,        group: software, note: "Открытый движок запуска моделей" }

  # ── Лаборатории ───────────────────────────────────────────────────────────
  - { id: openai,          group: labs, note: "Крупнейший покупатель вычислений" }
  - { id: anthropic,       group: labs, note: "Вторая лаборатория передовых моделей" }
  - { id: meta,            group: labs, note: "Покупатель и автор библиотеки обучения" }
  - { id: google-deepmind, group: labs, note: "Лаборатория внутри облака, обучается на своих чипах" }
  - { id: xai,             group: labs, note: "Молодая лаборатория с собственным кластером" }
  - { id: deepseek,        group: labs, note: "Китайская лаборатория; вызов допущению о пропорции" }

  # ── Инфраструктура и масштаб ──────────────────────────────────────────────
  - { id: microsoft,    group: infrastructure, note: "Azure; крупнейший инвестор ведущей лаборатории" }
  - { id: amazon,       group: infrastructure, note: "AWS и собственные ускорители" }
  - { id: google-cloud, group: infrastructure, note: "GCP — ЕДИНСТВЕННЫЙ пивот, отсутствовавший в v2" }
  - { id: brookfield,   group: infrastructure, note: "Инфраструктурный капитал: энергия и площадки" }

  # ── Критические поставщики ────────────────────────────────────────────────
  - { id: arista,   group: enablers, note: "Сети кластеров" }
  - { id: synopsys, group: enablers, note: "Софт проектирования чипов" }
  - { id: cadence,  group: enablers, note: "Второй поставщик софта проектирования" }

  # ── Геополитика и политика ────────────────────────────────────────────────
  - { id: taiwan, group: policy, note: "Территория, где делают передовой кремний" }
  # Блюпринт называет пивот «US Commerce Dept». В данных v2 юрисдикция (`usa`) и
  # ведомство (`bis`) разведены как разные сущности, и промпт требует свериться по
  # факту: пивот — именно ВЕДОМСТВО, которое пишет экспортные правила. `usa` остаётся
  # в сети обычной сущностью и не помечается pivotal.
  - { id: bis, group: policy, note: "Bureau of Industry and Security = пивот «US Commerce Dept»" }

# Новая сущность, которой в v2 не было. Заводится профилем по правилам контракта v2.
new_entities:
  - google-cloud
