# Сеть ИИ-инфраструктуры — выпуск и семя.
#
# ЭТОТ ФАЙЛ БОЛЬШЕ НЕ ЗАДАЁТ СОСТАВ. До v4 здесь лежал список из 27 пивотов, и он был
# входом: кто в списке — тот центр, а членство считалось шагами от ближайшего центра.
# Список удалён целиком, и это главная правка выпуска.
#
# Почему список пришлось убрать, а не поправить. Он воспроизводил ту же ошибку, что и
# единственный центр до него, только двадцать семь раз: важность узла назначалась
# снаружи, а карта потом подтверждала назначенное. Ровно поэтому «27 равноправных
# пивотов» уживались с тем, что степень одного узла в двадцать раз выше средней по
# сети, — цифра говорила одно, список другое, и спорить с ней было нечем.
#
# ТЕПЕРЬ ЯДРО — ЭТО ВЫХОД. `core: true` ставится верхним N по вычисленной
# integration.score; N и правило живут в config/nveco_scope.yaml (блок `core`), веса
# самой меры — в config/nvnet_edges.yaml (блок `integration_weights`). Ни здесь, ни
# где-либо ещё в репозитории нет строки, называющей узел важным вручную.
#
# Поле `pivotal` в файле передачи ОСТАЁТСЯ ровно на выпуск v4.0 и эмитится зеркалом
# `core`: дашборд читает его сегодня, и гасить его до его собственного прохода нельзя.
# Помечено deprecated, удаляется в v5.

# Номер выпуска. major растёт, когда меняется ФОРМА файла (ломающая правка контракта);
# minor — когда состав или меры обновились, а форма осталась совместимой.
# v1.1 — третья мера центральности (pagerank) ВНУТРЬ существующего блока `centrality`.
# v3.0 — контракт /3: у сущности появилось `description` ({ru, en}).
# v4.0 — контракт /4: снят `hops`, снят `strategicControl`, снят корневой `ecosystem`;
#        пришли `integration`, `sourcing`, `core`, `domains`, `cik`, `sidedness`,
#        `claimedBy`, `counterEvidence` и блок `meta`. Форма сломана — значит major.
release:
  major: 4
  minor: 0

network_id: ai-infrastructure-complete
seed: handoff/nvidia_ecosystem.json     # откуда берутся сущности и связи карты
