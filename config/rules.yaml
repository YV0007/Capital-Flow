# Signal rules — evaluated by engine/themes.py as SQL over the events table.
# Each rule: id, description, and parameters. The SQL lives in themes.py keyed by rule id.

sectors:
  # Canonical sector slugs — every event must map to one of these (the "where
  # capital lands" taxonomy for the AI buildout). Derived from the Capital Flow
  # Map groups. Unknown sectors are ingested but flagged as a warning.
  - ai-labs         # frontier model builders (OpenAI, Anthropic, xAI, Mistral, SSI)
  - ai-compute      # GPU / accelerator silicon (NVIDIA, AMD, custom ASIC)
  - semiconductors  # broader chips + foundry (TSMC, Broadcom, Intel)
  - fab-equipment   # litho / etch / deposition / packaging (ASML, AMAT, Lam, TEL, BESI)
  - cloud-hyperscale # hyperscaler compute capacity
  - neocloud        # GPU landlords / vendor-financed compute (CoreWeave, Crusoe, Lambda)
  - datacenters     # physical DC builds & operators (Stargate, Compass, Aligned, Switch)
  - power-energy    # turbines, grid gear, cooling (GE Vernova, Eaton, Vertiv, Schneider)
  - nuclear         # SMR / fusion / uranium (Oklo, Helion, Westinghouse, Cameco)
  - networking      # optical interconnect / photonics
  - robotics        # embodiment / humanoids
  - defense-tech    # defense outside the prime-contractor route (Anduril)
  - cybersecurity   # AI-adjacent security: agentic/software security, military-cyber, secure infra
  - ai-applications # application/vertical-layer AI (legal, enterprise, consumer)
  - ai-data         # data platforms & labeling that feed models (Databricks, Scale)
  # Non-AI sectors — sovereigns/alt-managers allocate here too and it's real capital
  # (e.g. PE take-privates like EA, Lucid). Tracked, but outside the AI buildout.
  - ev-automotive
  - private-credit
  - diversified-pe

# Curated sub-sector buckets — ONE level under `sectors`. A stable, reused
# vocabulary (like sectors/themes), NOT per-deal free text — so convergence on a
# specific narrative is detectable. Agents map each flow's subsector into the
# nearest bucket; unknown values pass through (may stay singleton until reconciled
# via subsector_aliases below). Only buckets that matter for trend clustering are
# listed; the long tail of one-off labels is fine as passthrough.
subsectors:
  ai-applications: [healthcare-ai, drug-discovery-ai, legal-regulatory-ai,
                    enterprise-ai-agents, fintech-ai, vertical-saas-ai, ai-for-science]
  ai-labs: [frontier-models, world-models, biological-foundation-models,
            superintelligence-research, sovereign-compute]
  ai-data: [data-labeling, data-platform, synthetic-data]
  semiconductors: [inference-asic, custom-silicon, advanced-packaging]
  robotics: [robot-foundation-models, industrial-automation, autonomous-mobility,
             critical-minerals-automation]
  defense-tech: [autonomous-systems, defense-manufacturing, critical-materials,
                 air-missile-defense]
  cybersecurity: [agentic-security, military-cyber, infrastructure-security]
  neocloud: [gpu-cloud-financing, gpu-capacity]
  datacenters: [hyperscale-campus, sovereign-datacenter, colocation]
  power-energy: [grid-storage, baseload-generation, energy-infrastructure]
  nuclear: [smr, fusion, uranium-fuel]

# Fold observed free-text subsector labels into the canonical buckets above so
# near-synonyms cluster. normalized (lower, hyphen) on the left. Extend as agents
# introduce new phrasings; unlisted values pass through unchanged.
subsector_aliases:
  military-ai-cyber: military-cyber
  military-cyber: military-cyber
  agentic-software-security: agentic-security
  spatial-ai-world-models: world-models
  world-models: world-models
  ai-drug-discovery: drug-discovery-ai
  policy-regulatory-intelligence: legal-regulatory-ai
  legal-regulatory-ai: legal-regulatory-ai
  enterprise-ai-financial-services-public-sector: enterprise-ai-agents
  logistics-ai-agents: enterprise-ai-agents
  agent-native-backend: enterprise-ai-agents
  private-credit-ops-agents: enterprise-ai-agents
  ai-driven-critical-minerals-mining: critical-minerals-automation
  autonomous-heavy-machinery: critical-minerals-automation
  frontier-model-lab: frontier-models
  frontier-models: frontier-models
  superintelligence-research: superintelligence-research
  brain-inspired-low-power-ai: frontier-models
  robot-foundation-models: robot-foundation-models
  physical-ai: robot-foundation-models
  wire-harness-manufacturing-automation: defense-manufacturing
  automated-factories: defense-manufacturing
  distributed-storage-grid: grid-storage
  real-economy-fintech: fintech-ai

themes:
  # Cross-cutting investment themes — ORTHOGONAL to `sectors` above. A deal has one
  # structural sector (where it sits in the stack) and one theme (what narrative it
  # belongs to). Signals and consensus form around themes.
  - frontier_ai          # frontier model labs & training runs
  - ai_infrastructure    # compute, datacenters, networking, the physical stack
  - ai_applications      # application/vertical-layer AI (legal, data platforms, SaaS)
  - defense_ai           # defense, national security, autonomy
  - energy_for_ai        # power, nuclear, grid built to serve compute
  - robotics_embodiment  # robotics, physical AI, autonomous systems
  - sovereign_ai         # state-backed AI capacity and national champions
  - biotech_ai           # AI for bio, longevity, scientific discovery
  - space                # space & orbital infrastructure
  - crypto_ai            # crypto/decentralized compute × AI
  - cyber_security       # AI-era security: agentic defense, military-cyber, secure infra

# Default sector -> theme mapping used when an agent doesn't supply a theme.
theme_defaults:
  ai-labs: frontier_ai
  ai-compute: ai_infrastructure
  semiconductors: ai_infrastructure
  fab-equipment: ai_infrastructure
  cloud-hyperscale: ai_infrastructure
  neocloud: ai_infrastructure
  datacenters: ai_infrastructure
  networking: ai_infrastructure
  power-energy: energy_for_ai
  nuclear: energy_for_ai
  robotics: robotics_embodiment
  defense-tech: defense_ai
  cybersecurity: cyber_security
  ai-applications: ai_applications
  ai-data: ai_applications

rules:
  - id: sector_swarm
    description: "N distinct key allocators put CONFIRMED capital (verified/verified_alpha)
      into the same sector within a window. Candidates don't count."
    min_allocators: 3
    window_days: 30
    allocator_tier: key

  - id: subsector_swarm
    description: "N distinct key/core allocators converge on the same (sector,
      subsector) narrative. Lower bar (sub-buckets are smaller); generous lookback,
      then trends[] re-checks the bar per 7d/30d/all window."
    min_allocators: 2
    window_days: 400

  - id: theme_swarm
    description: "N distinct key allocators converge on the same THEME within a window
      (cross-sector convergence — e.g. energy_for_ai across power + nuclear)"
    min_allocators: 4
    window_days: 30

  - id: capital_acceleration
    description: "Sector's rolling 90d capital total grew vs prior 90d by factor X"
    growth_factor: 2.0
    window_days: 90

  - id: first_entry
    description: "A key allocator entered a sector it had no prior events in"
    allocator_tier: key
    lookback_days: 365

  - id: smart_money_follow
    description: "A key/core allocator enters a sector, then N+ others follow within follow_days"
    window_days: 90
    follow_days: 21
    min_followers: 2

  - id: stealth_accumulation
    description: "N+ stakes (minority/equity/follow-on) into one target within a window"
    window_days: 90
    min_stakes: 3

  - id: beneficiary_concentration
    description: "N+ private flows map to one public beneficiary ticker"
    min_flows: 3
