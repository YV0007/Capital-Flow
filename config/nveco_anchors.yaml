# Реестр якорей. Экосистема = орбита ОДНОЙ компании, и якорь — её центр.
#
# На пилоте запись одна. Второй якорь через месяц — это новая запись здесь и новый
# прогон: слои, типы связей и рубрика от якоря не зависят и переиспользуются целиком.
# Больше ничего «на вырост» в движке нет и быть не должно.
#
# hops — правило двух шагов: сущность, до которой от якоря не дойти за столько ходов,
# в файл не попадает. Это и есть граница между «экосистемой NVIDIA» и «мировой
# полупроводниковой промышленностью».

default: nvidia

anchors:
  nvidia:
    id: nvidia
    name: NVIDIA
    ticker: "NASDAQ: NVDA"
    hops: 2
    ecosystem: nvidia          # -> поле `ecosystem` в файле передачи
    handoff: handoff/nvidia_ecosystem.json
    deliver_to: "~/Desktop/BASE/Code/ab-investment/src/data/nvidiaEcosystem.json"
    question: >
      Кто делает NVIDIA незаменимой, кто заперт в её орбите, кто её шлюзует
      и чем она хеджируется.
