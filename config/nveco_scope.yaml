# ОХВАТ КАРТЫ. Что стоит здесь вместо прежнего центра.
#
# До v4 членство определяла ОДНА компания: «сущность, до которой от NVIDIA не дойти
# за два шага, в файл не попадает». Правило работало, пока карта и была картой одной
# орбиты. Как только карта заявила себя сетью инфраструктуры ИИ, правило стало врать
# дважды: оно впускало всё, что NVIDIA случайно назвала в своей отчётности, и не
# впускало Carl Zeiss SMT, у которого есть и подтверждённые связи с ASML, и собственные
# публикации, — просто потому, что до него от центра три шага.
#
# Экосистема определяется СВОИМ ПРЕДМЕТОМ, а не компанией в середине. Предмет —
# шестнадцать слоёв config/nveco_layers.yaml: они и есть граница. Ни одна из трёх
# проверок ниже не упоминает ни одной компании, и это главное их свойство.

scope:
  ru: >-
    Инфраструктура ИИ: всё, без чего современная модель не может быть обучена,
    развёрнута, запитана, произведена или разрешена к продаже.
  en: >-
    AI infrastructure: everything without which a modern model cannot be trained,
    served, powered, manufactured or legally sold.
  # Предмет = слои. Список ЗЕРКАЛИТ config/nveco_layers.yaml и проверяется движком:
  # разойдясь, он молча сузил бы карту, а молча сужать границу нельзя.
  layers: [L0, L1, L2, L3, L4, L5, L6, L7, L8, L9, L10, L11, L12, L13, L14, L15]

# Три проверки, все обязательны. Пороги здесь, а не в коде: подкрутить границу
# карты — это решение, и оно должно быть видно в конфиге, а не в диффе Python.
membership:
  in_scope: true            # 1. работает хотя бы в одном слое охвата
  min_sources: 3            # 2. собственное досье: >= 3 источника
  min_self_sources: 1       #    из них >= 1 опубликован ею самой (см. entity_domains.yaml)
  min_confirmed_edges: 2    # 3. >= 2 подтверждённые связи с сущностями на карте

  # ВЫКЛЮЧЕНЫ В ФАЗЕ 0 НАМЕРЕННО.
  #
  # На собранных данных проверку self-источника не проходят 40 сущностей из 107 — это
  # и есть тот долг, ради которого затеяна кампания. Включить проверки сейчас значило бы
  # снести две пятых карты в тот же час, когда её нечем заменить: досье приезжают
  # Фазой 1. Поэтому Фаза 0 их СЧИТАЕТ и ОТЧИТЫВАЕТСЯ, но никого не отклоняет, а
  # включает их Фаза 3 — когда долг уже закрыт.
  #
  # Отчёт: runs/<месяц>/_membership/report.csv. Он не пустой ни в одном прогоне —
  # именно поэтому его стоит читать.
  enforce: false

  # Сущность, не прошедшая проверку 2 или 3, но названная в чужом досье, не
  # выбрасывается, а встаёт в очередь кандидатов. Очередь заводит Фаза 2.
  queue: runs/{month}/_queue/candidates.csv

core:
  rule: top_n_by_integration
  n: 30
  # `core` — это ВЫХОД, а не вход: верхние n по вычисленной integration.score.
  # Списка руками больше нет нигде. Прежний config/nvnet_pivots.yaml задавал 27
  # пивотов перечислением; его список удалён, а не переехал сюда.

# Куда едет карта. Раньше эти три строки лежали в записи центра и уезжали вместе с ним.
handoff: handoff/nvidia_ecosystem.json
deliver_to: "~/Desktop/BASE/Code/ab-investment/src/data/nvidiaEcosystem.json"
question:
  ru: >-
    Кто держит функцию, без которой стек не работает; насколько глубоко он в него вшит;
    и что ломается, если этого узла не станет.
  en: >-
    Who holds a function the stack cannot run without, how deeply they are wired into
    it, and what breaks if that node disappears.
