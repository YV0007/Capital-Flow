# ОХВАТ КАРТЫ. Что стоит здесь вместо прежнего центра.
#
# До v4 членство определяла ОДНА компания: «сущность, до которой от NVIDIA не дойти
# за два шага, в файл не попадает». Правило работало, пока карта и была картой одной
# орбиты. Как только карта заявила себя сетью инфраструктуры ИИ, правило стало врать
# дважды: оно впускало всё, что NVIDIA случайно назвала в своей отчётности, и не
# впускало Carl Zeiss SMT, у которого есть и подтверждённые связи с ASML, и собственные
# публикации, — просто потому, что до него от центра три шага.
#
# Экосистема определяется СВОИМ ПРЕДМЕТОМ, а не компанией в середине. Предмет —
# шестнадцать слоёв config/nveco_layers.yaml: они и есть граница. Ни одна из трёх
# проверок ниже не упоминает ни одной компании, и это главное их свойство.

scope:
  ru: >-
    Инфраструктура ИИ: всё, без чего современная модель не может быть обучена,
    развёрнута, запитана, произведена или разрешена к продаже.
  en: >-
    AI infrastructure: everything without which a modern model cannot be trained,
    served, powered, manufactured or legally sold.
  # Предмет = слои. Список ЗЕРКАЛИТ config/nveco_layers.yaml и проверяется движком:
  # разойдясь, он молча сузил бы карту, а молча сужать границу нельзя.
  layers: [L0, L1, L2, L3, L4, L5, L6, L7, L8, L9, L10, L11, L12, L13, L14, L15]

# Три проверки, все обязательны. Пороги здесь, а не в коде: подкрутить границу
# карты — это решение, и оно должно быть видно в конфиге, а не в диффе Python.
membership:
  in_scope: true            # 1. работает хотя бы в одном слое охвата
  min_sources: 3            # 2. собственное досье: >= 3 источника
  min_self_sources: 1       #    из них >= 1 опубликован ею самой (см. entity_domains.yaml)
  min_confirmed_edges: 2    # 3. >= 2 подтверждённые связи с сущностями на карте

  # ВКЛЮЧЕНЫ ФАЗОЙ 3. Ниже — ровно то, что означает «включены», потому что
  # буквальное включение уничтожило бы карту, и это измерено, а не предположено.
  #
  # ГЕЙТ ПО ПОКРЫТИЮ. `min_sources` и `min_self_sources` применяются к сущности
  # ТОЛЬКО после того, как её досье отработано (есть строка в `nveco_dossier_run`).
  # Фаза 0 померила: обе проверки не проходили почти все 107 сущностей семени — и не
  # потому, что узлам нечего предъявить, а потому, что до них не дошла очередь
  # ротации. Наказание за отсутствие ИССЛЕДОВАНИЯ вместо отсутствия оснований — это
  # не строгость, а подмена предмета. Непокрытая сущность несёт pending_dossier,
  # показывается на карте, помечена и не ретируется.
  #
  # `in_scope` и `min_confirmed_edges` действуют на всех сразу: они не спрашивают,
  # исследовали узел или нет.
  coverage_gated: [min_sources, min_self_sources]
  enforce: true

  # ЧТО ДЕЛАТЬ С ТЕМ, КТО НЕ ПРОШЁЛ. Два значения, и разница между ними — это
  # решение о том, чем карта дорожит больше.
  #
  #   retire_unheld (по умолчанию) — узел снимается, только если его не держит ни
  #     одно ребро. Провал членства узла X не является свидетельством против ребра
  #     X-Y: у ребра своя цитата и свой владелец, и снос узла молча удалил бы чужое
  #     утверждение, у которого источник есть, по причине, к нему не относящейся.
  #     Правило Фазы 0 «сущность, удерживаемая ребром, не каскадится прочь» здесь и
  #     защищается. Удержанный узел помечается и НАЗЫВАЕТСЯ в отчёте — молча не
  #     остаётся никто.
  #
  #   retire_all — строгий режим: снимается всё, что не прошло, вместе со связями,
  #     которые на снятое ссылались. На данных 2026-08 это сняло бы 34 узла из 108,
  #     и почти все — из-за min_confirmed_edges, то есть за то, что у них мало
  #     связей НА КАРТЕ. Половина из них при этом просто не исследована. Числа и
  #     поимённый список — в журнале Фазы 3.
  on_fail: retire_unheld

  # Сущность, не прошедшая проверку 2 или 3, но названная в чужом досье, не
  # выбрасывается, а встаёт в очередь кандидатов. Очередь заводит Фаза 2.
  queue: runs/{month}/_queue/candidates.csv

core:
  rule: top_n_by_integration
  n: 30
  # `core` — это ВЫХОД, а не вход: верхние n по вычисленной integration.score.
  # Списка руками больше нет нигде. Прежний config/nvnet_pivots.yaml задавал 27
  # пивотов перечислением; его список удалён, а не переехал сюда.

# Куда едет карта. Раньше эти три строки лежали в записи центра и уезжали вместе с ним.
handoff: handoff/nvidia_ecosystem.json
deliver_to: "~/Desktop/BASE/Code/ab-investment/src/data/nvidiaEcosystem.json"
question:
  ru: >-
    Кто держит функцию, без которой стек не работает; насколько глубоко он в него вшит;
    и что ломается, если этого узла не станет.
  en: >-
    Who holds a function the stack cannot run without, how deeply they are wired into
    it, and what breaks if that node disappears.

# ── РОТАЦИЯ: кого исследуем и как часто ──────────────────────────────────────
#
# Фаза 0 оставила открытым один вопрос, и он оказался важнее, чем выглядел.
# `integration` отвечает на «насколько глубоко узел вшит в карту». По ней ASML стоит
# 52-й, Carl Zeiss SMT — 108-й из 108. По `criticality` они же 7-й и 9-й. Это ровно
# те «скрытые точки удушения», ради которых две оси и разводились: узел держит
# функцию, без которой стек не работает, и почти ни с кем не связан НА КАРТЕ.
#
# Считать ярус ротации по одной интеграции значило бы отправить обоих в квартальный и
# триггерный циклы — то есть исследовать реже всего именно те узлы, про которые карта
# знает меньше всего. Низкая интеграция у такого узла — это в большой мере мера
# НАШЕГО НЕЗНАНИЯ о нём, а не факт о мире: у ASML на карте три связи не потому, что их
# три, а потому, что их никто не искал.
#
# Поэтому `basis: best_of_two` — ярус берётся по ЛУЧШЕМУ из двух рангов.
#
# Это НЕ отменяет `core` в payload: там по-прежнему верхние 30 по интеграции, как
# сказано контрактом, и дашборд ранжирует по ней. Два разных вопроса — два разных
# ответа. Слить их в одно понятие значило бы повторить ошибку якоря, который делал
# три работы сразу.
rotation:
  basis: best_of_two          # integration | criticality | best_of_two
  core_n: 30                  # верхние N по лучшему рангу — ежемесячно
  mid_share: 0.33             # следующая треть остатка — ежеквартально
  core_cadence_months: 1
  mid_cadence_months: 3
  tail_stale_months: 6        # хвост: по триггеру или по устарелости
  batch_size: 8
  monthly_budget: 40          # ~5 пакетов по 8 плюс проход сверки
