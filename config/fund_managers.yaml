# the 13F carries no strategy attribution — so the conviction desk CANNOT be
# parsed out of the filing. Anyone claiming otherwise is guessing. These four
# enter the section only on a disclosure that market-making mechanically cannot
# produce, and they appear in the UI only when a trigger fires.
