# FUND TRACKER (Section 3) — the closed, curated universe.
#
# This list is NOT discovered and NOT extended by the engine. Adding a fund is a
# deliberate edit here; engine/fund_ingest.py refuses any CIK it does not find in
# this file (it logs it to fund_unmapped_ciks instead of guessing).
#
# Every CIK below was resolved against EDGAR company search and then VERIFIED
# against https://data.sec.gov/submissions/CIK##########.json — the seed step
# re-verifies on every run and fails loudly on a name mismatch rather than
# ingesting somebody else's book.
#
# style_tag drives HOW a filing is read; manager_class drives WHETHER we ingest.
#   conviction_weight is the multiplier applied to every conviction_score.
#   multistrat_mm = 0.0 on 13F  -> the 13F is market-making inventory, not conviction
#   quant         = 0.0         -> not ingested at all
#
# primary_source names the layer that BEATS the 13F for this manager. For a
# full-disclosure vehicle the 13F is the fallback, not the source of record.

sec:
  # SEC fair-access policy: a declared User-Agent with a real contact email and
  # <=10 req/s. Set FUND_SEC_USER_AGENT in the environment (or user_agent here) —
  # the client REFUSES to make a network call without one rather than sending a
  # fake header and getting the whole section IP-blocked.
  user_agent: null            # e.g. "Capital Flow research <you@example.com>"
  max_requests_per_second: 8  # under the 10/s guidance, centrally enforced
  backfill_quarters: 8        # run-now principle: meaningful deltas on day one

