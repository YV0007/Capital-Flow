  - { from: 3021, to: 3021, sector: consumer_disc,   why: "rubber and plastics footwear — branded athletic and casual shoes" }
  - { from: 3080, to: 3089, sector: materials,       why: "plastics products" }
  - { from: 3861, to: 3861, sector: technology,      why: "photographic and imaging equipment" }
  - { from: 3990, to: 3999, sector: industrials,     why: "miscellaneous manufacturing — toys already claimed above" }
  - { from: 4600, to: 4799, sector: industrials,     why: "freight arrangement and transportation services — pipelines claimed above" }
  - { from: 7310, to: 7319, sector: communications,  why: "advertising and agencies — media, not commercial services" }
  - { from: 7320, to: 7329, sector: industrials,     why: "credit reporting and collection — commercial and professional services" }
  - { from: 7340, to: 7359, sector: industrials,     why: "building services, equipment rental and leasing" }
  - { from: 7380, to: 7389, sector: industrials,     why: "miscellaneous business services, security services" }
