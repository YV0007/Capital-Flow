# FUND TRACKER — sector of the ISSUER, derived from its SIC code.
#
# Why SIC and not a bought taxonomy. Every issuer in these books already files
# with the SEC, and EDGAR publishes its SIC on the submissions endpoint we
# already call. So the sector arrives with the identity we were fetching anyway:
# no vendor, no key, no licence, and every value traces to a primary source the
# reader can open. GICS would be cleaner and is not free.
#
# Why not the capital map's 18 sectors. Those are an AI-infrastructure taxonomy
# (datacenters, ai-compute, nuclear, defense-tech). They describe the *thesis*
# these funds are being read for, not the *businesses* they own. Third Point
# holds Kenvue, Tapestry and Lennar; no AI taxonomy classifies a homebuilder, and
# forcing one would leave most of a generalist book blank. Two taxonomies for two
# questions is the honest answer.
#
# ─────────────────────────────────────────────────────────────────────────────
# HOW THE RULES ARE READ. Ordered list, FIRST MATCH WINS. That is the whole
# mechanism, and it is why order is load-bearing: 2834 (pharma) must be tested
# before 2800-2899 (chemicals), and 6798 (REIT) before 6700-6799 (holding
# companies). Narrow ranges are therefore written above the broad ones that
# contain them, and the file must be read top to bottom.
#
# A code matching NOTHING is not guessed. It is stored with sector `null`, listed
# by the audit, and the holding still ships — with a blank sector rather than a
# wrong one. `unmapped_is_an_error: false` says that out loud: an unclassified
# issuer is a gap to close, not a reason to refuse the payload.
unmapped_is_an_error: false

sectors:
  energy:         { label: "Energy",                 note: "Extraction, refining, pipelines, oilfield services" }
  utilities:      { label: "Utilities",              note: "Regulated and merchant electric, gas, water" }
  materials:      { label: "Materials",              note: "Mining, chemicals, paper, steel, building materials" }
  industrials:    { label: "Industrials",            note: "Machinery, aerospace and defense, transport, engineering" }
  technology:     { label: "Technology",             note: "Semiconductors, hardware, software, IT services" }
  healthcare:     { label: "Health Care",            note: "Pharma, biotech, devices, providers, life-science tools" }
  financials:     { label: "Financials",             note: "Banks, brokers, insurers, asset managers" }
  real_estate:    { label: "Real Estate",            note: "REITs, operators, developers" }
  consumer_disc:  { label: "Consumer Discretionary", note: "Retail, autos, apparel, hotels, homebuilding" }
  consumer_staple: { label: "Consumer Staples",       note: "Food, beverage, tobacco, household and personal products" }
  communications: { label: "Communication Services", note: "Telecom, media, entertainment, interactive" }

# ── rules: [from, to] inclusive on the 4-digit SIC, first match wins ─────────
rules:
  # -- narrow overrides that must outrank the broad ranges below --------------
  - { from: 1531, to: 1531, sector: consumer_disc,   why: "operative builders — homebuilders are consumer cyclicals, not construction services" }
  - { from: 2833, to: 2836, sector: healthcare,      why: "pharma and biological products, ahead of the chemicals block" }
  - { from: 2840, to: 2844, sector: consumer_staple, why: "soap, detergents, cosmetics — household products, ahead of chemicals" }
  - { from: 2911, to: 2911, sector: energy,          why: "petroleum refining, ahead of manufacturing" }
  - { from: 3826, to: 3826, sector: healthcare,      why: "laboratory analytical instruments — life-science tools" }
  - { from: 4610, to: 4613, sector: energy,          why: "pipelines, ahead of the transportation block" }
  - { from: 5122, to: 5122, sector: consumer_staple, why: "drugs and toiletries wholesale" }
  - { from: 5171, to: 5172, sector: energy,          why: "petroleum wholesale" }
  - { from: 5912, to: 5912, sector: consumer_staple, why: "drug stores" }
  - { from: 6798, to: 6798, sector: real_estate,     why: "REIT, ahead of holding and investment offices" }

  # -- services and the rest of manufacturing ---------------------------------
  # Added after the first backfill: 69 held issuers matched no rule, and 46 of
  # them sat in the 7300-8799 services block. Listed by SIC, narrow first.
