# Per-network metrics to compute over time (documentation of intent; the engine
# evaluates the tractable subset below).
network_tracking:
  - { network: paypal_mafia,    priority: core, metrics: [new_investments, follow_on_investments, disclosed_capital, repeat_coinvestors, repeat_founders, board_seats, new_funds, new_spvs, sector_concentration, sector_rotation, public_market_beneficiaries] }
  - { network: thiel_extended,  priority: core, metrics: [new_investments, network_coinvestment, founders_fund_participation, defense_and_government_links, repeat_founders, capital_by_theme, public_supplier_readthrough] }
  - { network: thiel_fellowship, priority: core, metrics: [new_company_formation, alumni_funding_rounds, alumni_personal_investments, follow_on_funding, tier_one_coinvestors, new_sector_entry, founder_to_investor_transition] }

# Network signal rules. `network_convergence` is evaluated by engine/themes.py today.
# The others are declared (intent captured) and fire once the supporting data is
# modeled — same pattern as the history-dependent rules in rules.yaml.
network_signal_rules:
  - { signal: network_convergence,        condition: "3+ members of one network put confirmed capital in the same sector within a window", window_days: 180, min_members: 3, weight: 5, status: active }
  - { signal: thiel_repeat_conviction,    condition: "Founders Fund / Thiel vehicle invests in the same theme 3+ times",                weight: 5, status: declared }
  - { signal: fellowship_breakout,        condition: "fellowship alumnus raises a round with 2+ tier-one allocators",                    weight: 4, status: declared }
  - { signal: defense_network_convergence, condition: "Thiel network + strategic corporate or government capital in one theme",           weight: 5, status: declared }
  - { signal: private_to_public_spillover, condition: "network capital clusters in a theme with under-recognized public suppliers",       weight: 5, status: declared }
