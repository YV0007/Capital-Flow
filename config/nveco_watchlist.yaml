    seeds:
      - { id: nventures,   name: "NVIDIA Ventures (NVentures)", layer: L14, must: true }
      - { id: softbank,    name: SoftBank,            layer: L14 }
      - { id: mgx,         name: MGX,                 layer: L14 }
      - { id: sequoia,     name: "Sequoia Capital",   layer: L14 }
