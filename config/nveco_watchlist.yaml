      - { id: blackrock,   name: BlackRock,           layer: L14 }
      - { id: blackstone,  name: Blackstone,          layer: L14 }
      - { id: thrive,      name: "Thrive Capital",    layer: L14 }
      - { id: lightspeed,  name: "Lightspeed Venture Partners", layer: L14 }
      - { id: index-ventures, name: "Index Ventures", layer: L14 }

  # Восьмой агент. Запускается ПОСЛЕ остальных семи и новых сущностей НЕ ищет.
  nveco-strategic:
    layers: ["*"]
    target_entities: null
    seeds: []
    mandate: >
      Контуры, которые не видит ни один слоевой агент, рвы, хеджи и список дыр
      на следующий месяц. Ставит межслойные рёбра хребтов moat и rivalry.
