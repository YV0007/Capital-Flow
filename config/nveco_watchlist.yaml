# Экосистема NVIDIA — стартовый список на прогон, по агентам.
#
# ЭТО ЗАТРАВКА, А НЕ ОТВЕТ. Список собран из §«NVIDIA Blueprint: Layer-by-Layer»
# блюпринта и задаёт STEP 1 (BASELINE DISCOVERY). Агент ОБЯЗАН искать сверх него:
# партнёрский директорий NVIDIA, каталог NVIDIA-Certified Systems, повестка GTC и
# раздел про поставщиков в 10-K называют компании, которых здесь нет.
#
# id — постоянный slug сущности в файле передачи. Он пишется один раз и не меняется
# никогда: переименование = потеря истории.
# must — сущность обязательна к покрытию. Если после прогона её нет, это ДЫРА, а не
# решение, и она попадает в журнал сборки.

anchor: nvidia

agents:

  nveco-geo:
    layers: [L0, L15]
    target_entities: [10, 14]
    seeds:
      - { id: nvidia,     name: NVIDIA,             layer: L10, must: true, note: "Якорь. Заводится здесь, потому что geo читает 10-K первым." }
      - { id: usa,        name: США,                layer: L0, must: true }
      - { id: taiwan,     name: Тайвань,            layer: L0, must: true }
      - { id: china,      name: Китай,              layer: L0, must: true }
      - { id: netherlands, name: Нидерланды,        layer: L0, must: true }
      - { id: south-korea, name: "Южная Корея",     layer: L0, must: true }
      - { id: japan,      name: Япония,             layer: L0 }
      - { id: eu,         name: "Европейский союз", layer: L0 }
      - { id: singapore,  name: Сингапур,           layer: L0 }
      - { id: bis,        name: "Bureau of Industry and Security", layer: L15, must: true }
      - { id: cfius,      name: CFIUS,              layer: L15, must: true }
      - { id: eu-ai-act,  name: "Регламент ЕС об ИИ", layer: L15 }
      - { id: chips-act,  name: "CHIPS Act",        layer: L15 }
      - { id: mlcommons,  name: MLCommons,          layer: L15 }

  nveco-silicon:
