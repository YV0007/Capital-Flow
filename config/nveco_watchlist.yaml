    seeds:
      - { id: openai,      name: OpenAI,              layer: L12, must: true }
      - { id: anthropic,   name: Anthropic,           layer: L12, must: true }
      - { id: meta,        name: Meta,                layer: L12, must: true }
      - { id: xai,         name: xAI,                 layer: L12, must: true }
      - { id: mistral,     name: "Mistral AI",        layer: L12 }
      - { id: deepseek,    name: DeepSeek,            layer: L12 }
      - { id: google-deepmind, name: "Google DeepMind", layer: L12 }
