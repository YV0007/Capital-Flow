      - { id: applied-materials, name: "Applied Materials", layer: L1 }
      - { id: lam-research, name: "Lam Research",     layer: L1 }
      - { id: tokyo-electron, name: "Tokyo Electron", layer: L1 }
      - { id: kla,         name: KLA,                 layer: L1 }
      - { id: zeiss-smt,   name: "Carl Zeiss SMT",    layer: L1 }
      - { id: shin-etsu,   name: "Shin-Etsu Chemical", layer: L1 }
      - { id: synopsys,    name: Synopsys,            layer: L2, must: true }
      - { id: cadence,     name: Cadence,             layer: L2, must: true }
      - { id: arm,         name: Arm,                 layer: L2, must: true }
      - { id: siemens-eda, name: "Siemens EDA",       layer: L2 }
      - { id: tsmc,        name: TSMC,                layer: L3, must: true }
      - { id: samsung,     name: Samsung,             layer: L3, must: true }
      - { id: intel,       name: Intel,               layer: L3 }
      - { id: ase,         name: "ASE Technology",    layer: L3 }
      - { id: amkor,       name: "Amkor Technology",  layer: L3 }
      - { id: sk-hynix,    name: "SK Hynix",          layer: L4, must: true }
      - { id: micron,      name: Micron,              layer: L4, must: true }
      - { id: kioxia,      name: Kioxia,              layer: L4 }
      - { id: sandisk,     name: SanDisk,             layer: L4 }

  nveco-systems:
    layers: [L5, L8, L9]
    target_entities: [16, 22]
    seeds:
      - { id: foxconn,     name: Foxconn,             layer: L5, must: true }
      - { id: supermicro,  name: Supermicro,          layer: L5, must: true }
      - { id: wistron,     name: Wistron,             layer: L5 }
      - { id: quanta,      name: "Quanta Computer",   layer: L5 }
      - { id: dell,        name: Dell,                layer: L5 }
      - { id: hpe,         name: HPE,                 layer: L5 }
      - { id: arista,      name: "Arista Networks",   layer: L8, must: true }
      - { id: broadcom,    name: Broadcom,            layer: L8, must: true }
      - { id: marvell,     name: Marvell,             layer: L8 }
      - { id: astera-labs, name: "Astera Labs",       layer: L8 }
      - { id: credo,       name: "Credo Technology",  layer: L8 }
      - { id: coherent,    name: Coherent,            layer: L8 }
      - { id: fabrinet,    name: Fabrinet,            layer: L8 }
      - { id: cisco,       name: Cisco,               layer: L8 }
      - { id: microsoft,   name: Microsoft,           layer: L9, must: true }
      - { id: amazon,      name: Amazon,              layer: L9, must: true }
      - { id: google,      name: Google,              layer: L9, must: true }
      - { id: oracle,      name: Oracle,              layer: L9 }
      - { id: coreweave,   name: CoreWeave,           layer: L9, must: true }
      - { id: nebius,      name: Nebius,              layer: L9, must: true }
