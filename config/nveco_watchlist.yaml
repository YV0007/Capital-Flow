  nveco-power:
    layers: [L6, L7]
    target_entities: [10, 14]
    seeds:
      - { id: eaton,       name: Eaton,               layer: L6, must: true }
      - { id: schneider,   name: "Schneider Electric", layer: L6 }
      - { id: ge-vernova,  name: "GE Vernova",        layer: L6 }
      - { id: siemens-energy, name: "Siemens Energy", layer: L6 }
      - { id: delta-electronics, name: "Delta Electronics", layer: L6 }
      - { id: constellation, name: "Constellation Energy", layer: L6 }
      - { id: bloom-energy, name: "Bloom Energy",     layer: L6 }
      - { id: brookfield,  name: Brookfield,          layer: L6 }
      - { id: vertiv,      name: Vertiv,              layer: L7, must: true }
      - { id: nvent,       name: nVent,               layer: L7 }
      - { id: boyd,        name: "Boyd Corporation",  layer: L7 }
      - { id: lite-on,     name: "LiteOn Technology", layer: L7 }

  nveco-software:
    layers: [L10, L11]
    target_entities: [12, 16]
    seeds:
      - { id: cuda,        name: CUDA,                layer: L10, must: true }
      - { id: pytorch,     name: PyTorch,             layer: L10, must: true }
      - { id: jax,         name: JAX,                 layer: L10 }
