# Сеть v3 — РАСШИРЕНИЕ таксономии связей, а не замена.
#
# Лежит отдельным файлом намеренно. config/nveco_edges.yaml заморожен вместе со всем
# контрактом v2, и его CHECK-констрейнт в db/schema_nveco.sql перечисляет ровно 31 тип.
# Дописать туда два новых типа значило бы либо разойтись со схемой, либо править
# замороженную схему ради достройки. Поэтому расширение лежит рядом и подмешивается
# ТОЛЬКО сетевым слоем (engine/nvnet.py); месячный конвейер v2 продолжает читать свои 31
# и остаётся самосогласованным.

types:
  is_alternative_to:
    spine: rivalry
    verb: "жизнеспособная замена для"
    verb_en: "is a viable replacement for"
    label: "Путь-замена"
    label_en: "Replacement path"
    default_direction: lateral
    note: >
      Работающий путь-замена СУЩЕСТВУЕТ — это не то же самое, что активная конкуренция за
      рынок. Открытая среда AMD не отбирает у CUDA долю в привычном смысле, но она есть,
      она поддержана той же библиотекой обучения, и именно поэтому замок не абсолютен.
      Разница с `competes_with` в том, что здесь утверждается наличие ВЫХОДА, а не борьба.

  enables_interop:
    spine: physical
    verb: "сшивает через стандарт"
    verb_en: "bridges through a standard"
    label: "Совместимость"
    label_en: "Interoperability"
    default_direction: bidirectional
    note: >
      Стандарт позволяет двум иначе раздельным стекам разговаривать. Не поставка и не
      партнёрство: никто никому ничего не отгружает, но благодаря общему интерфейсу
      продукты разных владельцев подставляются друг вместо друга.

# ─────────────────────────────────────────────────────────────────────────────
# Куда течёт вес PageRank: карта ЗАВИСИМОСТИ по всем 33 типам связей.
#
# Зачем это нужно. PageRank отвечает на вопрос «на кого опираются те, на кого сами
# опираются» — вопрос заведомо НАПРАВЛЕННЫЙ. Посчитать его на неориентированном графе
# технически можно, но проверка на этих данных даёт корреляцию с degree 0.9988: мера
# перестаёт нести собственный смысл и становится дорогим синонимом степени.
#
# Проблема в том, что 33 типа таксономии указывают в РАЗНЫЕ стороны относительно
# зависимости. `supplies` записан от поставщика к потребителю — зависит получатель.
# `customer_of` записан от покупателя к продавцу — зависит источник. Одного правила на
# всех нет, поэтому карта задаётся здесь явно и её можно оспорить, не читая Python.
#
# Модель: ребро — это ГОЛОС ЗАВИСИМОГО за того, от кого он зависит. Вес течёт ОТ
# зависимого К тому, на кого опираются.
#   to_source — зависит цель, вес течёт target -> source (типичная поставка)
#   to_target — зависит источник, вес течёт source -> target (типичная закупка)
#   both      — взаимная зависимость, вес течёт в обе стороны
#   none      — это не зависимость вовсе; в графе PageRank ребро не участвует
#
# `none` у всего хребта rivalry — сознательно. Конкуренция это не «опора»: то, что AMD
# соперничает с NVIDIA, не делает NVIDIA важнее в смысле унаследованной важности. Иначе
# любой громкий конкурент подкачивал бы вес тому, кого атакует.
pagerank_dependence:
  # physical — обычно зависит получатель
  manufactures:     to_source     # разработчик без фабрик зависит от фабрики
  supplies:         to_source
  packages:         to_source
  integrates:       to_source     # владелец продукта зависит от сборщика
  delivers_to:      to_source
  enables:          to_source     # без первого бизнес второго не работает вовсе
  co_designs:       both          # совместная инженерия — зависимость обоюдная
  optimizes_for:    to_target     # продукт заточен под чужую платформу и зависит от неё
  enables_interop:  both          # стандарт держит оба стека

  # capital — зависит тот, кто получает деньги; при закупке — тот, кто платит
  invests_in:       to_source
  funded_by:        to_target     # записан от получателя к источнику денег
  board_seat:       to_source
  strategic_partner: both
  hedges_against:   to_source     # объект хеджа живёт на эти деньги
  diversifies_supply: to_target   # держащий второй источник зависит от его наличия
  customer_of:      to_target     # покупатель зависит от продавца

  # moat — доказательство и стандарт: вес идёт к тому, чью незаменимость доказывают
  validates_demand: to_target
  proves_roi:       to_target
  proves_use_case:  to_target
  locks_in_developers: both       # среда держит фреймворк, массовость фреймворка — среду
  locks_in_platforms:  both
  path_dependent_on: to_target    # чья траектория повторяется, тот и опора
  standardizes_on:  to_target
  sets_benchmark:   to_source     # планку задаёт источник, на неё равняется цель
  defines_category: to_source

  # control — зависит подконтрольный
  controls_access_to:       to_source
  subject_to_restriction:   to_target   # записан от подконтрольного к режиму
  export_controlled_by:     to_source   # в данных источник — само ведомство
  geopolitically_dependent: to_source   # в данных источник — территория

  # rivalry — не зависимость
  competes_with:      none
  threatens:          none
  could_disrupt:      none
  is_alternative_to:  none
