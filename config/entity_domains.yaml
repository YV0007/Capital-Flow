# РЕЕСТР ИЗДАТЕЛЕЙ. Кто чей URL — единственный вход правила SELF.
#
# Зачем он существует. До v4 тир источника считался по одной зашитой таблице, где
# nvidia.com стоял тиром 1, а всё остальное — тиром 2. Это была не шкала
# «официальности», а шкала «близости к NVIDIA»: пресс-релиз TSMC про TSMC получал тир 2
# у себя же дома. Здесь точка отсчёта переезжает к ПРЕДМЕТУ: тир 1 — это когда о
# сущности говорит она сама, кем бы она ни была.
#
# Как читается запись:
#   domains — хосты и префиксы путей, которые сущность издаёт САМА.
#             Запись без «/» матчится по хосту с учётом поддоменов:
#             `nvidia.com` покрывает `blogs.nvidia.com` и `nvidianews.nvidia.com`.
#             Запись со «/» матчится по «хост+путь»: `github.com/pytorch/` —
#             это PyTorch, а не GitHub, потому что общий хост принадлежит всем.
#   cik     — код эмитента в EDGAR. Отчётность по этому CIK — тоже SELF, даже если
#             хост общий (sec.gov один на всех).
#   from    — откуда взято: sources (доказано URL, уже лежащим в собранных данных),
#             external_ids (config/external_ids.yaml), known (общеизвестно, данными
#             этого прогона НЕ подтверждено — кандидат на проверку в Фазе 1).
#
# ОДИН ДОМЕН МОЖЕТ ПРИНАДЛЕЖАТЬ НЕСКОЛЬКИМ СУЩНОСТЯМ, и это не ошибка: побеждает
# САМОЕ ДЛИННОЕ совпадение, поэтому `developer.nvidia.com/cuda` — это CUDA, а
# `nvidia.com` — это NVIDIA. Разведение сделано намеренно: 10-K NVIDIA не является
# собственным словом CUDA о себе, хотя владелец у них один.
#
# ПУСТОЙ `domains` — ЭТО ФАКТ, А НЕ ПРОБЕЛ. У закона нет своего издателя: текст
# публикует законодатель, а не сам закон. Правило `min_self_sources` для такой
# сущности снимается ровно этим фактом, а не исключением в коде.

