# Экосистема NVIDIA — таксономия слоёв. ЗАМОРОЖЕНА.
#
# ЕДИНСТВЕННОЕ место, где живут слои. Ни один Python-модуль не имеет права написать 'L3'
# в коде: всё читается отсюда. Придёт 16 слоёв или 20 — конвейер и дашборд соберутся.
#
# Три плана карты — главная геометрическая идея v2:
#   nucleus (L14) — ядро молекулы. Капитал владеет стеком и финансирует его, сам в нём
#                   не стоя.
#   orbit (L1..L13) — 13 ячеек по кольцу. Угол задаёт `order`, цвет — `band`,
#                   радиус считает раскладка на стороне дашборда.
#   control (L0, L15) — внешняя дуга. Государства, агентства и стандарты не стоят
#                   в стеке, они его ШЛЮЗУЮТ. Вставить США между «памятью» и «системами»
#                   значит соврать про природу связи.
#
# label — ЗАГЛАВНЫМИ, <= 16 знаков. caption — строчными, <= 28 знаков.
# band отсутствует у control и nucleus: у них своя палитра, не полосовая.

layers:
  - { id: L0,  label: "ГЕОПОЛИТИКА", label_en: "GEOPOLITICS",    caption: "юрисдикции · контроль доступа", caption_en: "jurisdictions · gatekeeping", plane: control, order: 0,  band: null }
  - { id: L1,  label: "СЫРЬЁ И СТАНКИ", label_en: "INPUTS & TOOLS", caption: "материалы · оборудование", caption_en: "materials · equipment",      plane: orbit,   order: 1,  band: 1 }
  - { id: L2,  label: "ПРОЕКТИРОВАНИЕ", label_en: "CHIP DESIGN", caption: "софт для чипов · лицензии", caption_en: "EDA software · IP licences",     plane: orbit,   order: 2,  band: 1 }
  - { id: L3,  label: "ФАБРИКИ", label_en: "FABS",        caption: "литография · процесс", caption_en: "lithography · process",          plane: orbit,   order: 3,  band: 2 }
  - { id: L4,  label: "ПАМЯТЬ", label_en: "MEMORY",         caption: "HBM · DRAM · хранение", caption_en: "HBM · DRAM · storage",         plane: orbit,   order: 4,  band: 2 }
  - { id: L5,  label: "СИСТЕМЫ", label_en: "SYSTEMS",        caption: "сборка · серверы · стойки", caption_en: "assembly · servers · racks",     plane: orbit,   order: 5,  band: 3 }
  - { id: L6,  label: "ЭНЕРГИЯ", label_en: "POWER",        caption: "генерация · передача тока", caption_en: "generation · transmission",     plane: orbit,   order: 6,  band: 3 }
  - { id: L7,  label: "ОХЛАЖДЕНИЕ", label_en: "COOLING",     caption: "тепло · вода · жидкость", caption_en: "heat · water · liquid",       plane: orbit,   order: 7,  band: 3 }
  - { id: L8,  label: "СВЯЗЬ", label_en: "NETWORKING",          caption: "сеть · оптика · коммутация", caption_en: "fabric · optics · switching",    plane: orbit,   order: 8,  band: 4 }
  - { id: L9,  label: "ИНФРАСТРУКТУРА", label_en: "INFRASTRUCTURE", caption: "площадки · облака", caption_en: "sites · clouds",             plane: orbit,   order: 9,  band: 4 }
  - { id: L10, label: "СОФТ ДЛЯ GPU", label_en: "GPU SOFTWARE",   caption: "CUDA · на чём пишут код", caption_en: "CUDA · what you code against",       plane: orbit,   order: 10, band: 5 }
  - { id: L11, label: "ИНФЕРЕНС", label_en: "INFERENCE",       caption: "запуск моделей · оркестрация", caption_en: "serving · orchestration",  plane: orbit,   order: 11, band: 5 }
  - { id: L12, label: "ЛАБОРАТОРИИ", label_en: "FRONTIER LABS",    caption: "модели · обучение", caption_en: "models · training",             plane: orbit,   order: 12, band: 5 }
  - { id: L13, label: "ПРИЛОЖЕНИЯ", label_en: "APPLICATIONS",     caption: "ИИ в бизнесе · отрасли", caption_en: "AI in business · verticals",        plane: orbit,   order: 13, band: 5 }
  - { id: L14, label: "КАПИТАЛ", label_en: "CAPITAL",        caption: "кто владеет и финансирует", caption_en: "who owns and funds it",     plane: nucleus, order: 14, band: null }
  - { id: L15, label: "РЕГУЛИРОВАНИЕ", label_en: "REGULATION",  caption: "правила · субсидии · стандарты", caption_en: "rules · subsidies · norms", plane: control, order: 15, band: null }

# Сектора — собственная таксономия карты. Ни одного поля, указывающего в DC-AI.
# key используется в entities[].sector; label — то, что видит человек.
