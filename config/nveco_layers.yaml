# Полосы критичности — как читать итоговый балл. Дашборд берёт подписи отсюда.
criticality_bands:
  - { min: 90, max: 100, key: critical,  label: "критично", label_en: "critical" }
  - { min: 75, max: 89,  key: high,      label: "высоко", label_en: "high" }
  - { min: 60, max: 74,  key: medium,    label: "средне", label_en: "medium" }
  - { min: 45, max: 59,  key: low_mid,   label: "ниже среднего", label_en: "below average" }
  - { min: 0,  max: 44,  key: low,       label: "низко", label_en: "low" }

# Тех-узлы — ТЕХНОЛОГИИ, а не компании: процессы, упаковка, протоколы связи.
# Компания, даже если она по сути платформа (CUDA), заводится СУЩНОСТЬЮ и живёт в
# entities[] со своими связями; сюда попадает только то, что связью быть не может.
# На ребре тех-узел работает подписью: он объясняет, ПОЧЕМУ зависимость неразрывна.
tech_nodes:
  - { id: euv,        label: "EUV",         owner: asml,     importance: critical, note: "Печать самых мелких элементов чипа", note_en: "Printing the finest features on a chip" }
  - { id: n3,         label: "3 нм",        owner: tsmc,     importance: critical, note: "Передовой техпроцесс производства", note_en: "The leading-edge process node" }
  - { id: n5,         label: "5 нм",        owner: tsmc,     importance: high,     note: "Предыдущий передовой техпроцесс", note_en: "The previous leading-edge node" }
  - { id: cowos,      label: "CoWoS",       owner: tsmc,     importance: critical, note: "Упаковка «чип + память» на одной подложке", note_en: "Die-and-memory packaging on one substrate" }
  - { id: hbm,        label: "HBM",         owner: sk-hynix, importance: critical, note: "Стековая память вплотную к ускорителю", note_en: "Stacked memory sitting against the accelerator" }
  - { id: nvlink,     label: "NVLink",      owner: nvidia,   importance: critical, note: "Связь ускорителей внутри стойки", note_en: "Accelerator-to-accelerator link inside the rack" }
  - { id: infiniband, label: "InfiniBand",  owner: nvidia,   importance: high,     note: "Сеть между стойками кластера", note_en: "The network between racks of a cluster" }
  - { id: spectrum-x, label: "Spectrum-X",  owner: nvidia,   importance: medium,   note: "Ethernet-сеть под кластеры ускорителей", note_en: "Ethernet fabric built for accelerator clusters" }
  - { id: arm-isa,    label: "Arm ISA",     owner: arm,      importance: high,     note: "Набор команд процессоров", note_en: "The processor instruction set" }
  - { id: pcie,       label: "PCIe",        owner: null,     importance: medium,   note: "Общая шина подключения устройств", note_en: "The common bus for attaching devices" }
