# Полосы критичности — как читать итоговый балл. Дашборд берёт подписи отсюда.
criticality_bands:
  - { min: 90, max: 100, key: critical,  label: "критично" }
  - { min: 75, max: 89,  key: high,      label: "высоко" }
  - { min: 60, max: 74,  key: medium,    label: "средне" }
  - { min: 45, max: 59,  key: low_mid,   label: "ниже среднего" }
  - { min: 0,  max: 44,  key: low,       label: "низко" }

# Тех-узлы — ТЕХНОЛОГИИ, а не компании: процессы, упаковка, протоколы связи.
# Компания, даже если она по сути платформа (CUDA), заводится СУЩНОСТЬЮ и живёт в
# entities[] со своими связями; сюда попадает только то, что связью быть не может.
# На ребре тех-узел работает подписью: он объясняет, ПОЧЕМУ зависимость неразрывна.
tech_nodes:
  - { id: euv,        label: "EUV",         owner: asml,     importance: critical, note: "Печать самых мелких элементов чипа" }
  - { id: n3,         label: "3 нм",        owner: tsmc,     importance: critical, note: "Передовой техпроцесс производства" }
  - { id: n5,         label: "5 нм",        owner: tsmc,     importance: high,     note: "Предыдущий передовой техпроцесс" }
  - { id: cowos,      label: "CoWoS",       owner: tsmc,     importance: critical, note: "Упаковка «чип + память» на одной подложке" }
  - { id: hbm,        label: "HBM",         owner: sk-hynix, importance: critical, note: "Стековая память вплотную к ускорителю" }
  - { id: nvlink,     label: "NVLink",      owner: nvidia,   importance: critical, note: "Связь ускорителей внутри стойки" }
  - { id: infiniband, label: "InfiniBand",  owner: nvidia,   importance: high,     note: "Сеть между стойками кластера" }
  - { id: spectrum-x, label: "Spectrum-X",  owner: nvidia,   importance: medium,   note: "Ethernet-сеть под кластеры ускорителей" }
  - { id: arm-isa,    label: "Arm ISA",     owner: arm,      importance: high,     note: "Набор команд процессоров" }
  - { id: pcie,       label: "PCIe",        owner: null,     importance: medium,   note: "Общая шина подключения устройств" }
