# Экосистема NVIDIA — таксономия слоёв. ЗАМОРОЖЕНА.
#
# ЕДИНСТВЕННОЕ место, где живут слои. Ни один Python-модуль не имеет права написать 'L3'
# в коде: всё читается отсюда. Придёт 16 слоёв или 20 — конвейер и дашборд соберутся.
#
# Три плана карты — главная геометрическая идея v2:
#   nucleus (L14) — ядро молекулы. Капитал владеет стеком и финансирует его, сам в нём
#                   не стоя.
#   orbit (L1..L13) — 13 ячеек по кольцу. Угол задаёт `order`, цвет — `band`,
#                   радиус считает раскладка на стороне дашборда.
#   control (L0, L15) — внешняя дуга. Государства, агентства и стандарты не стоят
#                   в стеке, они его ШЛЮЗУЮТ. Вставить США между «памятью» и «системами»
#                   значит соврать про природу связи.
#
# label — ЗАГЛАВНЫМИ, <= 16 знаков. caption — строчными, <= 28 знаков.
# band отсутствует у control и nucleus: у них своя палитра, не полосовая.

layers:
  - { id: L0,  label: "ГЕОПОЛИТИКА",    caption: "юрисдикции · контроль доступа", plane: control, order: 0,  band: null }
  - { id: L1,  label: "СЫРЬЁ И СТАНКИ", caption: "материалы · оборудование",      plane: orbit,   order: 1,  band: 1 }
  - { id: L2,  label: "ПРОЕКТИРОВАНИЕ", caption: "софт для чипов · лицензии",     plane: orbit,   order: 2,  band: 1 }
  - { id: L3,  label: "ФАБРИКИ",        caption: "литография · процесс",          plane: orbit,   order: 3,  band: 2 }
  - { id: L4,  label: "ПАМЯТЬ",         caption: "HBM · DRAM · хранение",         plane: orbit,   order: 4,  band: 2 }
  - { id: L5,  label: "СИСТЕМЫ",        caption: "сборка · серверы · стойки",     plane: orbit,   order: 5,  band: 3 }
  - { id: L6,  label: "ЭНЕРГИЯ",        caption: "генерация · передача тока",     plane: orbit,   order: 6,  band: 3 }
  - { id: L7,  label: "ОХЛАЖДЕНИЕ",     caption: "тепло · вода · жидкость",       plane: orbit,   order: 7,  band: 3 }
  - { id: L8,  label: "СВЯЗЬ",          caption: "сеть · оптика · коммутация",    plane: orbit,   order: 8,  band: 4 }
  - { id: L9,  label: "ИНФРАСТРУКТУРА", caption: "площадки · облака",             plane: orbit,   order: 9,  band: 4 }
  - { id: L10, label: "СОФТ ДЛЯ GPU",   caption: "CUDA · на чём пишут код",       plane: orbit,   order: 10, band: 5 }
  - { id: L11, label: "ИНФЕРЕНС",       caption: "запуск моделей · оркестрация",  plane: orbit,   order: 11, band: 5 }
  - { id: L12, label: "ЛАБОРАТОРИИ",    caption: "модели · обучение",             plane: orbit,   order: 12, band: 5 }
  - { id: L13, label: "ПРИЛОЖЕНИЯ",     caption: "ИИ в бизнесе · отрасли",        plane: orbit,   order: 13, band: 5 }
  - { id: L14, label: "КАПИТАЛ",        caption: "кто владеет и финансирует",     plane: nucleus, order: 14, band: null }
  - { id: L15, label: "РЕГУЛИРОВАНИЕ",  caption: "правила · субсидии · стандарты", plane: control, order: 15, band: null }

# Сектора — собственная таксономия карты. Ни одного поля, указывающего в DC-AI.
# key используется в entities[].sector; label — то, что видит человек.
sectors:
