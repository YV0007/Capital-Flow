  - { key: fab_equipment,     label: "Станки для фабрик",     label_en: "Fab equipment",      layer: L1 }
  - { key: eda,               label: "Софт для чипов",               label_en: "EDA software",         layer: L2 }
  - { key: chip_ip,           label: "Лицензии на схемы",           label_en: "Chip IP licences",      layer: L2 }
  - { key: foundry,           label: "Фабрики",           label_en: "Foundries",                layer: L3 }
  - { key: packaging,         label: "Упаковка кристаллов",         label_en: "Die packaging",    layer: L3 }
  - { key: hbm,               label: "Память HBM",               label_en: "HBM memory",             layer: L4 }
  - { key: dram,              label: "Оперативная память",              label_en: "DRAM",     layer: L4 }
  - { key: storage,           label: "Хранение",           label_en: "Storage",               layer: L4 }
